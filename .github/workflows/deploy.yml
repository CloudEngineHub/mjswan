name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'examples/demo/main.py'
      - 'src/mjswan/**'
      - 'pyproject.toml'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.12'

    # Only what `examples/demo/main.py` imports. `examples` additionally carries
    # onnxruntime, which the numeric-parity checks need and this build does not.
    - name: Install Python dependencies
      run: uv sync --extra hf --extra mjlab

    - name: Build demo application
      run: |
        MJSWAN_BASE_PATH="/mjswan/" MJSWAN_NO_LAUNCH=1 uv run python examples/demo/main.py
        echo "=== Dist size ==="
        du -h -d 1 examples/demo/dist 2>/dev/null | sort -rh | head -20

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: examples/demo/dist

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
