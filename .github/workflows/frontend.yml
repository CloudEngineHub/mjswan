name: frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Use Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          cd src/mjswan/template
          npm install

      - name: Run eslint
        run: |
          cd src/mjswan/template
          npx eslint .

      # Node-only unit tests. The engine runtime needs WebGL + WASM and is
      # covered by the browser harness instead (vitest.config.ts).
      - name: Run vitest
        run: |
          cd src/mjswan/template
          npm test
